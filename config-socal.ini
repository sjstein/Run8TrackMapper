# Rail-vehicle rendering line widths (optional; defaults shown).
[trains]
car_width = 9      ; RV body min width in px (floor at low zoom)
car_width_m = 3.5  ; real RV width in m; body widens with zoom to stay wider than
                   ; the track at every zoom (never below car_width). 0 = fixed px.
spine_width = 2.0  ; train connecting-line (spine) width in px
label_scale_m = 10 ; show per-RV destination tags when the scale bar reads this (m) or tighter
deoverlap = true   ; lay each consist's cars end-to-end (front->back, coupled footprints) so
                   ; coupled cars don't overlap. false = raw per-truck placement.
lod_scale_m = 100  ; At what zoom level we switch plotting to simpler lines
lod_min_cars = 5   ; For trains with this number of cars or less, when zoomed out to LOD value, don't plot
lod_color = #4d5156 ; colour of a collapsed (zoomed-out) train line (darker = more visible on white). The
                    ; track also snaps to [track] min_width at this same zoom, so they thin out together.
moving_hysteresis = 10 ; The number of world-save load cycles to go through before marking a moving train as stationary

[track]
; Track line width scales with zoom (thinner when zoomed out).
width = 5          ; full track line width in px at/above full_zoom
min_width = 1.5    ; floor width in px when zoomed far out
full_zoom = 14     ; zoom at/above which the line shows full width; below it the width
                   ; halves per zoom level down to min_width. 0 = fixed `width` (no scaling).
