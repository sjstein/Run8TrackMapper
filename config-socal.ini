[visualization]
name = SoCal 
tile_corrections = tile_corrections.csv
region_dir = C:\Run8Studios\Run8 Train Simulator V3\Content\V3Routes\Regions\SouthernCA
areas_file = areas_socal.ini
world_save = _depot_world.xml
railvehicle_db = db_railvehicles.db
# Initial opacity slider values (percent 0-100, or a 0-1 fraction). Defaults: map 20, track 80.
;initial_map_opacity = 20
;initial_track_opacity = 80

[region.arvin]
display_name = Arvin/OakCreek
route_prefix = 310
directory = ArvinOakCreekBranches
enabled_by_default = true

[region.bakersfield]
display_name = Bakersfield
route_prefix = 250
directory = BNSF_BakersfieldSub
enabled_by_default = true

[region.barstow]
display_name = Barstow/Yermo
route_prefix = 150
directory = BarstowYermo
enabled_by_default = true

[region.cajon]
display_name = Cajon
route_prefix = 120
directory = BNSF_CajonSub
enabled_by_default = true

[region.modesto]
display_name = Fresno/Modesto
route_prefix = 340
directory = BNSF_UP_FresnoModesto
enabled_by_default = true

[region.mojave]
display_name = Mojave
route_prefix = 100
directory = BNSF_MojaveSub
enabled_by_default = true

[region.needles]
display_name = Needles
route_prefix = 110
directory = BNSF_NeedlesSub
enabled_by_default = true

[region.sanbernardino]
display_name = SanBernardino
route_prefix = 200
directory = BNSF_SanBernardinoSub
enabled_by_default = true

[region.seligman]
display_name = Seligman
route_prefix = 130
directory = BNSF_SeligmanSub
enabled_by_default = true

[region.trona]
display_name = Trona
route_prefix = 320
directory = TronaRailway
enabled_by_default = true

[region.upfresno]
display_name = UP_Fresno
route_prefix = 101
directory = UP_FresnoSub_South
enabled_by_default = true

[tile_based_plot]
home_tile = 92,9
tile_width = 842.3
tile_height = 1023.2

[colors]
# Track colors
track = #4488ee
track_selected = #ff0000
track_hover = #90D5FF
switch = #5599ee
industry_track = #00aa00
# Background color (for tile mode)
background = #e4eaed
# Signal colors
signal_absolute = #FF6B35
signal_intermediate = #FFD700
signal_border_single = #000000
signal_border_stacked = #87CEEB
# Generic Train car colors
train_loco = #f85d13   ; locomotive body colour

# Named color presets for area labels: use a name (e.g. color = bnsf) on a label,
# or pick it from the editor's Color dropdown. Add your own railroads here.
[color_presets]
bnsf = #f85d13
up = #ffcc00
amtrak = #0078b9

# Area-label categories: id = Display Name, #color  (order = filter order).
# The display name shows in the filter/editor; the color is the category default
# (a label's own color= still wins). A label with an undefined type renders white.
[label_types]
yard = Yard, #ffd11a
cp = CP, #ff6b35
region = Region, #ffffff
station = Station, #0078b9

# RV body colour by car type (DB INDUSTRY_CONFIG_CAR_TYPE). One entry per type;
# grouped into families below. Locomotives use [colors] train_loco; a car type
# with no entry falls back to [colors] train. (Keys are case-insensitive.)
[car_type_colors]
# Tanks - dark grey
Tank_Car = #404040
Acid_Tank_Car = #404040
# Hoppers - light green
Covered_Hopper = #90ee90
Two_Bay_Covered_Hopper = #90ee90
Open_Hopper = #90ee90
PlasticPellet_Hopper = #90ee90
Ballast_Hopper = #90ee90
AggregateHopper = #90ee90
Woodchip_Hopper = #90ee90
# Flats - light red
Piggyback_Flat_Car = #ff9999
Centerbeam_Flat_Car = #ff9999
Bulkhead_Flat = #ff9999
# Reefers - light grey
Refrigerator_Car = #707070
# Box - dark red
Box_Car = #8b0000
Box_Autoparts = #8b0000
# Gondola - medium brown
Gondola = #a0522d
BethGon = #a0522d
# Coil - orange
CoilCar = #ffa500
# None / uncategorized - yellow
None = #ffff00
# Not in the depot save & not in a named bucket - sensible defaults, adjust as desired
Well_Car = #4682b4
Passenger_Car = #0078b9
Autorack_Car = #9370db
Amtrak_Autorack_Car = #9370db
MOW = #808000

[loco_company_colors]
# Colour locomotives by their owning railroad, keyed by the loco DB's INITIAL
# reporting mark (case-insensitive). Any mark not listed here (or a loco whose
# rvXMLfilename isn't in the DB) falls back to [colors] train_loco. Loco colouring
# takes precedence over car-type colouring for engines.
BNSF = #ff8c00      ; BNSF orange
ATSF = #cc0000      ; Santa Fe warbonnet red
UP   = #ffcf01      ; Union Pacific Armour yellow
UPY  = #d9b310      ; UP yard (darker yellow)
SP   = #b22222      ; Southern Pacific scarlet
DRGW = #ff7300      ; Rio Grande orange
WP   = #e67e22      ; Western Pacific orange
CSXT = #14477a      ; CSX dark blue
NS   = #1a1a1a      ; Norfolk Southern black
BN   = #2e5d34      ; Burlington Northern Cascade green
CN   = #e03a1e      ; Canadian National red
KCS  = #b31217      ; Kansas City Southern red
AMTK = #003d7d      ; Amtrak blue
R8W  = #808080      ; Run8 house units (neutral grey)

[output]
output_dir = ./output/socal/

# route info
;BNSF_MojaveSub	100	SouthernCA
;UP_FresnoSub_South 101 SouthernCA
;BNSF_NeedlesSub	110	SouthernCA
;BNSF_CajonSub	120	SouthernCA
;BNSF_SeligmanSub	130	SouthernCA
;CSX_ALine	140	HRS_Southeast
;BarstowYermo	150	SouthernCA
;CSX_SelkirkTerminal	170	SelkirkRegion
;BNSF_SanBernardinoSub	200	SouthernCA
;CSX_Waycross	210	HRS_Southeast
;CSX_Fitzgerald	230	HRS_Southeast
;CSX_MohawkSub	240	SelkirkRegion
;BNSF_BakersfieldSub	250	SouthernCA
;SP-UP_RosevilleSub	260	NorthernCA
;SP-NS_AGS_Phase01	280	GulfCoast
;NS_PittsburghLine_East	290	Pennsylvania
;NS_South_Fork_Secondary	291	Pennsylvania
