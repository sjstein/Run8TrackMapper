# Area / place labels for PR-SoCal (config-precisionRails.ini)
# ---------------------------------------------------------------------------
# Referenced from the main config via:  [visualization] areas_file = areas_socal-pr.ini
# Inline [area.*] sections in the main config and these are merged; duplicate
# ids are rejected.
#
# Each label is one [area.<id>] section. <id> must be unique across all files.
#
#   [area.<id>]
#   label     = <text>        REQUIRED  text drawn on the map
#   tile      = <x>,<z>       REQUIRED  tile index (tile_x, tile_z)
#   local     = <x>,<z>       REQUIRED  Run8 local coords within that tile (local_x, local_z)
#   color     = #rrggbb        optional  text color (default: [colors] area_label) bnsf: 
#                              amtrak color:	#003399
#                              bnsf color: 	#f85d13
#                              up color:	#ffcc00
#   font_size = <int>          optional  size in px at the 50 m scale bar (default: 22);
#                                        labels scale down as you zoom out
#   box       = true|false     optional  draw a background box behind the text (default: false)
#   rotation  = <degrees>      optional  rotate text, clockwise, to align to a track/yard (default: 0)
#
# Tip: in the rendered map, Shift+Click to place a label, then click a second
# point along a track to set the angle (or Esc for horizontal). The popup
# generates a ready-to-paste [area.*] block.
# ---------------------------------------------------------------------------

